<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mael Uber - Passageiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- TomTom Maps Web SDK CSS -->
  <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css"/>
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; display: flex; flex-direction: column; font-family: Arial, sans-serif; }
    header { background: #0e0f0f; color: white; text-align: center; padding: 12px; font-size: 20px; font-weight: bold; }
    #map { flex: 1; width: 100%; }
    footer { text-align: center; padding: 15px; background: #292727; color: white; }
    button { background: #1e88e5; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #1568b4; }
    button:disabled { background: #555; cursor: not-allowed; }
    #cobranca { margin-top: 10px; text-align: center; }
    #valorTotal { background-color: #1e88e5; color: white; padding: 12px 20px; border-radius: 12px; font-weight: bold; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.2); margin-top: 10px; }
    #enderecos{ background: #292727; color: white; text-align: center; padding: 12px; font-size: 20px; font-weight: bold; }
    #enderecos table { margin:auto; }
    #enderecos input { padding: 6px; width: 250px; border: none; border-radius: 4px; outline: none; color: #000; }
    #sugestoesDestino { position: absolute; background: white; border: 1px solid #aaa; width: 250px; max-height: 150px; overflow-y: auto; z-index: 1000; color: black; font-weight: normal; font-size: 14px; left: 50%; transform: translateX(-50%); }
    #sugestoesDestino div { padding: 5px; cursor: pointer; text-align: left; }
    #sugestoesDestino div:hover { background: #cce5ff; }
    #procurandoMotorista { display: none; margin-top: 15px; font-size: 18px; color: #d6d6d6; font-weight: bold; }
    
    /* Estilo do Chat estilo WhatsApp */
    #chat-container { display: none; margin-top: 15px; background: #fff; color: #000; padding: 12px; border-radius: 8px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    #mensagens { height: 120px; overflow-y: auto; border: 1px solid #ccc; padding: 8px; margin-bottom: 10px; background: #f9f9f9; border-radius: 4px; font-size: 14px; }
    .msg-motorista { color: #007bff; margin-bottom: 5px; }
    .msg-passageiro { color: #28a745; margin-bottom: 5px; }

    /* Custom TomTom popup styling */
    .tomtom-popup-content { text-align: center; color: #333; font-family: Arial, sans-serif; }
    .tomtom-popup-content b { font-size: 14px; }
  </style>
</head>
<body>
  <header>Mael Uber - Passageiro</header>

  <div id="enderecos">
    <table>
      <tr>
        <td>Nome:</td>
        <td><input type="text" id="inputApelido" placeholder="Digite seu apelido"></td>
      </tr>
      <tr>
        <td>Origem:</td>
        <td><input type="text" id="inputOrigem" placeholder="Digite a origem"></td>
      </tr>
      <tr>
        <td>Destino:</td>
        <td>
          <div style="position: relative;">
            <input type="text" id="inputDestino" placeholder="Digite o destino" oninput="buscarSugestoes()">
            <div id="sugestoesDestino"></div>
          </div>
        </td>
      </tr>
    </table>
    <button id="btnTracar" onclick="definirRota()" style="margin-top: 15px;">Traçar Rota</button>
  </div>

  <div id="map"></div>

  <footer>
    <button id="btnIniciar" onclick="iniciarCorrida()">Iniciar Corrida</button>
    <div id="cobranca">
      <h3><span id="valorTotal">Valor da corrida: R$ <span id="valor">0.00</span></span></h3>
      <div id="procurandoMotorista">Procurando motorista parceiro...</div>
    </div>

    <!-- Chat em tempo real com o motorista -->
    <div id="chat-container">
      <h4 style="margin: 0 0 8px 0; color: #333;" id="tituloChat">Chat com o Motorista</h4>
      <div id="mensagens"></div>
      <div style="display: flex; gap: 5px;">
        <input type="text" id="inputMensagem" placeholder="Digite uma mensagem..." style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none;" onkeypress="if(event.key === 'Enter') enviarMensagem()">
        <button onclick="enviarMensagem()" style="padding: 8px 15px; font-size: 14px;">Enviar</button>
      </div>
    </div>
  </footer>

  <!-- TomTom Maps Web SDK JS -->
  <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
  
  <!-- Firebase SDKs (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, onSnapshot, updateDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Credenciais oficiais do seu projeto Firebase (mael-uber)
    const firebaseConfig = {
      apiKey: "AIzaSyBAp1CRfM_nn5GAn1gzhutrtgED7RQc4RY",
      authDomain: "mael-uber.firebaseapp.com",
      databaseURL: "https://mael-uber-default-rtdb.firebaseio.com",
      projectId: "mael-uber",
      storageBucket: "mael-uber.firebasestorage.app",
      messagingSenderId: "939220832919",
      appId: "1:939220832919:web:c9bfb4ca302f1aeefb4fd2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const apiKeyTomTom = "6ZqDMi0F9yeDIGtl2wW6NFGEEM3Wbfgg";
    
    let map = null;
    let origem = null; 
    let destino = null; 
    let marcadorOrigem = null; 
    let marcadorDestino = null;
    let camadaRotaId = 'rota-passageiro-layer';
    let corridaIdAtual = null;
    let unsubMensagens = null;

    // Inicialização idêntica à abordagem do motorista
    const centerCoords = [-46.633308, -23.550520]; // [lng, lat] padrão

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        origem = [pos.coords.longitude, pos.coords.latitude]; // [lng, lat]
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        
        document.getElementById("inputOrigem").value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        
        if (map) {
          map.setCenter([lng, lat]);
          map.setZoom(15);
        }

        if (marcadorOrigem) {
          marcadorOrigem.setLngLat(origem);
        } else if (map) {
          const popupOrigem = new tt.Popup({offset: 30}).setHTML("<div class='tomtom-popup-content'><b>Você está aqui!</b></div>");
          marcadorOrigem = new tt.Marker().setLngLat(origem).setPopup(popupOrigem).addTo(map);
          marcadorOrigem.togglePopup();
        }
      }, () => {}, { enableHighAccuracy: true });
    }

    map = tt.map({
      key: apiKeyTomTom,
      container: 'map',
      center: centerCoords,
      zoom: 13
    });

    map.addControl(new tt.NavigationControl());

    map.on('load', () => {
      setTimeout(() => { map.resize(); }, 200);
    });

    async function enderecoParaCoords(endereco) {
      if (endereco.includes(",")) {
        const partes = endereco.split(",");
        const lat = parseFloat(partes[0]);
        const lon = parseFloat(partes[1]);
        return [lon, lat]; // Retorna [lng, lat]
      }
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}&limit=1`);
        const data = await response.json();
        return data.length > 0 ? [parseFloat(data[0].lon), parseFloat(data[0].lat)] : null;
      } catch (e) { return null; }
    }

    window.definirRota = async function() {
      const btn = document.getElementById("btnTracar");
      const origemInput = document.getElementById("inputOrigem").value;
      const destinoInput = document.getElementById("inputDestino").value;

      if (!origemInput || !destinoInput) {
        alert("⚠️ Digite origem e destino!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Calculando...";

      const coordsOrigem = await enderecoParaCoords(origemInput);
      const coordsDestino = await enderecoParaCoords(destinoInput);

      if (!coordsOrigem || !coordsDestino) {
        alert("Local não encontrado!");
        btn.disabled = false;
        btn.innerText = "Traçar Rota";
        return;
      }

      origem = coordsOrigem;
      destino = coordsDestino;

      if (marcadorOrigem) marcadorOrigem.remove();
      if (marcadorDestino) marcadorDestino.remove();

      const popupOrigem = new tt.Popup({offset: 30}).setHTML("<div class='tomtom-popup-content'><b>Origem</b></div>");
      marcadorOrigem = new tt.Marker().setLngLat(origem).setPopup(popupOrigem).addTo(map);
      marcadorOrigem.togglePopup();

      const popupDestino = new tt.Popup({offset: 30}).setHTML("<div class='tomtom-popup-content'><b>Destino</b></div>");
      marcadorDestino = new tt.Marker().setLngLat(destino).setPopup(popupDestino).addTo(map);
      marcadorDestino.togglePopup();

      try {
        const urlRoute = `https://api.tomtom.com/routing/1/calculateRoute/${origem[1]},${origem[0]}:${destino[1]},${destino[0]}/json?key=${apiKeyTomTom}&traffic=true&language=pt-BR`;
        const response = await fetch(urlRoute);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const coordsGeoJSON = route.legs[0].points.map(p => [p.longitude, p.latitude]);

          const geojson = {
            type: "Feature",
            geometry: {
              type: "LineString",
              coordinates: coordsGeoJSON
            }
          };

          if (map.getSource(camadaRotaId)) {
            map.getSource(camadaRotaId).setData(geojson);
          } else {
            map.addSource(camadaRotaId, {
              type: 'geojson',
              data: geojson
            });

            map.addLayer({
              id: camadaRotaId,
              type: 'line',
              source: camadaRotaId,
              layout: {
                'line-join': 'round',
                'line-cap': 'round'
              },
              paint: {
                'line-color': '#1e88e5',
                'line-width': 6
              }
            });
          }

          // Ajusta o zoom para enquadrar a rota
          const bounds = new tt.LngLatBounds();
          coordsGeoJSON.forEach(coord => bounds.extend(coord));
          map.fitBounds(bounds, { padding: 50, maxZoom: 15 });

         const distKm = route.summary.lengthInMeters / 1000;
const taxaInicial = 8.00;
const valorTotal = taxaInicial + (distKm * 2.5);
document.getElementById("valor").textContent = valorTotal.toFixed(2);
        } else {
          alert("Erro ao calcular rota!");
        }
      } catch (e) {
        console.error("Erro na API de Rota TomTom:", e);
        alert("Erro ao calcular rota via TomTom!");
      }

      btn.disabled = false;
      btn.innerText = "Traçar Rota";
    };

    window.buscarSugestoes = async function() {
      const queryVal = document.getElementById("inputDestino").value;
      const sugestoesDiv = document.getElementById("sugestoesDestino");
      if (queryVal.length < 3) { sugestoesDiv.innerHTML = ""; return; }

      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryVal)}&limit=5`);
      const data = await response.json();
      sugestoesDiv.innerHTML = "";
      data.forEach(item => {
        const div = document.createElement("div");
        div.textContent = item.display_name;
        div.onclick = () => {
          document.getElementById("inputDestino").value = item.display_name;
          sugestoesDiv.innerHTML = "";
          definirRota();
        };
        sugestoesDiv.appendChild(div);
      });
    };

    map.on('click', function(event) {
      const lng = event.lngLat.lng;
      const lat = event.lngLat.lat;
      document.getElementById("inputDestino").value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      definirRota();
    });

    // Envia o pedido de corrida para o Firebase
    window.iniciarCorrida = async function() {
      const apelido = document.getElementById("inputApelido").value || 'Passageiro';
      const destinoNome = document.getElementById("inputDestino").value;
      const valorStr = document.getElementById("valor").textContent;
      const precoFinal = parseFloat(valorStr) || 0.00;

      if (!origem || !destino) {
        alert("⚠️ Trace a rota primeiro!");
        return;
      }

      document.getElementById("procurandoMotorista").style.display = "block";
      document.getElementById("btnIniciar").style.display = "none";

      try {
        const docRef = await addDoc(collection(db, "corridas"), {
          apelido: apelido,
          origemLat: origem[1], // lat
          origemLng: origem[0], // lng
          destinoLat: destino[1], // lat
          destinoLng: destino[0], // lng
          destinoNome: destinoNome,
          preco: precoFinal, // <--- ADICIONADO: Envia o valor calculado para o Firestore
          status: "procurando",
          timestamp: serverTimestamp()
        });

        corridaIdAtual = docRef.id;

        // Fica escutando atualizações da corrida (quando o motorista aceitar)
        onSnapshot(doc(db, "corridas", corridaIdAtual), (docSnap) => {
          if (docSnap.exists()) {
            const dados = docSnap.data();
            if (dados.status === "aceita") {
              document.getElementById("procurandoMotorista").style.display = "none";
              document.getElementById("chat-container").style.display = "block";
              document.getElementById("tituloChat").innerText = `Chat com o Motorista`;
              escutarMensagensChat(corridaIdAtual);
            }
          }
        });

      } catch (e) {
        console.error("Erro ao iniciar corrida:", e);
        alert("Erro ao conectar com o servidor.");
        document.getElementById("procurandoMotorista").style.display = "none";
        document.getElementById("btnIniciar").style.display = "inline-block";
      }
    };

    function escutarMensagensChat(idCorrida) {
      const mensagensRef = collection(db, "corridas", idCorrida, "mensagens");
      const qMsgs = query(mensagensRef, orderBy("timestamp", "asc"));

      if (unsubMensagens) unsubMensagens();

      unsubMensagens = onSnapshot(qMsgs, (snapshot) => {
        const mensagensDiv = document.getElementById("mensagens");
        mensagensDiv.innerHTML = "";
        snapshot.forEach((docMsg) => {
          const m = docMsg.data();
          const classe = m.remetente === "passageiro" ? "msg-passageiro" : "msg-motorista";
          const nomeRemetente = m.remetente === "passageiro" ? "Você" : "Motorista";
          mensagensDiv.innerHTML += `<div class="${classe}"><b>${nomeRemetente}:</b> ${m.texto}</div>`;
        });
        mensagensDiv.scrollTop = mensagensDiv.scrollHeight;
      });
    }

    window.enviarMensagem = async function() {
      const texto = document.getElementById("inputMensagem").value;
      if (!texto || !corridaIdAtual) return;

      document.getElementById("inputMensagem").value = "";

      const mensagensRef = collection(db, "corridas", corridaIdAtual, "mensagens");
      await addDoc(mensagensRef, {
        remetente: "passageiro",
        texto: texto,
        timestamp: serverTimestamp()
      });
    };
  </script>
</body>
</html>
