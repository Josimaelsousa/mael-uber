<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mael Uber - Painel do Motorista</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- TomTom Maps Web SDK CSS -->
  <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css"/>
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; display: flex; flex-direction: column; font-family: Arial, sans-serif; }
    header { background: #0e0f0f; color: white; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; font-size: 20px; font-weight: bold; box-sizing: border-box; }
    
    /* Botão Atualizar Mapa no Cabeçalho */
    #btnAtualizarMapa {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #btnAtualizarMapa:hover { background: #138496; }
    
    /* Tela de Login/Identificação do Motorista */
    #tela-login {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0e0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .login-card {
      background: #292727;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      color: white;
    }
    .login-card h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; color: #28a745; }
    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      font-size: 16px;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-card button:hover { background: #218838; }

    #app-container { display: none; flex: 1; flex-direction: column; height: 100%; width: 100%; }
    #map { flex: 1; width: 100%; }
    footer { background: #292727; color: white; padding: 15px; text-align: center; }
    button { background: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #218838; }
    #info-corrida { font-size: 18px; color: #d6d6d6; margin-bottom: 10px; }
    
    /* Estilo do Chat estilo WhatsApp */
    #chat-container { display: none; margin-top: 15px; background: #fff; color: #000; padding: 12px; border-radius: 8px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    #mensagens { height: 120px; overflow-y: auto; border: 1px solid #ccc; padding: 8px; margin-bottom: 10px; background: #f9f9f9; border-radius: 4px; font-size: 14px; }
    .msg-motorista { color: #007bff; margin-bottom: 5px; }
    .msg-passageiro { color: #28a745; margin-bottom: 5px; }

    /* Custom TomTom popup styling */
    .tomtom-popup-content { text-align: center; color: #333; font-family: Arial, sans-serif; }
    .tomtom-popup-content b { font-size: 14px; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN DO MOTORISTA -->
  <div id="tela-login">
    <div class="login-card">
      <h2>Mael Uber - Motorista</h2>
      <input type="text" id="inputNomeMotorista" placeholder="Seu Nome completo">
      <input type="text" id="inputTelMotorista" placeholder="Seu Número de Telefone">
      <button onclick="entrarPainel()">Entrar no Painel</button>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="app-container">
    <header>
      <span>Painel do Motorista - Mael Uber (<span id="spanNomeMotorista"></span>)</span>
      <button id="btnAtualizarMapa" onclick="atualizarMapa()">Atualizar Mapa</button>
    </header>

    <div id="map"></div>

    <footer>
      <div id="info-corrida">Aguardando chamadas de passageiros...</div>
      <button id="btnAceitar" style="display:none;" onclick="aceitarCorrida()">Aceitar Corrida</button>
      <!-- Botão de Finalizar adicionado -->
      <button id="btnFinalizar" style="display:none; background: #dc3545; margin-top: 5px;" onclick="finalizarCorrida()">Finalizar Corrida</button>

      <!-- Chat em tempo real -->
      <div id="chat-container">
        <h4 style="margin: 0 0 8px 0; color: #333;" id="tituloChat">Chat com o Passageiro</h4>
        <div id="mensagens"></div>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="inputMensagem" placeholder="Digite uma mensagem..." style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none;" onkeypress="if(event.key === 'Enter') enviarMensagem()">
          <button onclick="enviarMensagem()" style="padding: 8px 15px; font-size: 14px;">Enviar</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- TomTom Maps Web SDK JS -->
  <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
  
  <!-- Firebase SDKs (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, updateDoc, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAp1CRfM_nn5GAn1gzhutrtgED7RQc4RY",
      authDomain: "mael-uber.firebaseapp.com",
      databaseURL: "https://mael-uber-default-rtdb.firebaseio.com",
      projectId: "mael-uber",
      storageBucket: "mael-uber.firebasestorage.app",
      messagingSenderId: "939220832919",
      appId: "1:939220832919:web:c9bfb4ca302f1aeefb4fd2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let map = null;
    let rotaLayerId = 'rota-motorista-layer';
    let marcadoresPassageiros = {}; // Dicionário para guardar múltiplos marcadores por ID de corrida (armazenando { marker, popup })
    let corridaAtualId = null;
    let dadosCorridaAtual = null;
    let unsubMensagens = null;
    let dadosMotorista = { nome: "", telefone: "" };
    let emCorridaAtiva = false; // Trava de segurança para isolar o motorista

    const apiKeyTomTom = "6ZqDMi0F9yeDIGtl2wW6NFGEEM3Wbfgg";
    let localizacaoMotorista = null;

    // Função de Login/Identificação (exposta globalmente)
    window.entrarPainel = function() {
      const nome = document.getElementById("inputNomeMotorista").value.trim();
      const telefone = document.getElementById("inputTelMotorista").value.trim();

      if (!nome || !telefone) {
        alert("⚠️ Por favor, preencha o seu nome e o número de telefone!");
        return;
      }

      dadosMotorista = { nome, telefone };
      document.getElementById("spanNomeMotorista").innerText = nome;

      // Esconde a tela de login e mostra a aplicação
      document.getElementById("tela-login").style.display = "none";
      document.getElementById("app-container").style.display = "flex";

      // Inicializa o mapa do TomTom e as escutas
      if (!map) {
        const centerCoords = [-46.633308, -23.550520]; // TomTom usa [lng, lat] para inicializar setCenter

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            localizacaoMotorista = [pos.coords.latitude, pos.coords.longitude];
            if (map) {
              map.setCenter([pos.coords.longitude, pos.coords.latitude]);
              map.setZoom(14);
            }
          }, () => {}, { enableHighAccuracy: true });
        }

        map = tt.map({
          key: apiKeyTomTom,
          container: 'map',
          center: centerCoords,
          zoom: 13
        });

        map.addControl(new tt.NavigationControl());

        map.on('load', () => {
          iniciarEscutaCorridas();
        });
      }
      setTimeout(() => { 
        if (map) map.resize(); 
      }, 200);
    };

    // Função de Atualizar o Mapa solicitada
    window.atualizarMapa = function() {
      if (map) {
        map.resize();
        if (localizacaoMotorista) {
          map.setCenter([localizacaoMotorista[1], localizacaoMotorista[0]]);
        }
        alert("🗺️ Mapa atualizado com sucesso!");
      }
    };

    function iniciarEscutaCorridas() {
      const q = query(collection(db, "corridas"), orderBy("timestamp", "desc"));
      onSnapshot(q, (snapshot) => {
        let totalProcurando = 0;
        let ultimaCorridaProcurando = null;

        snapshot.forEach((docSnap) => {
          const dados = docSnap.data();
          const id = docSnap.id;

          // Se a corrida mudou de status ou foi finalizada/aceita por outro, remove o marcador dela se existir
          if (dados.status !== "procurando" && dados.status !== "aceita") {
            if (marcadoresPassageiros[id]) {
              marcadoresPassageiros[id].marker.remove();
              delete marcadoresPassageiros[id];
            }
            return;
          }

          // Se o motorista NÃO está em corrida ativa e o status é procurando, exibe no mapa
          if (!emCorridaAtiva && dados.status === "procurando") {
            totalProcurando++;
            ultimaCorridaProcurando = { id, dados };

            const lng = dados.origemLng;
            const lat = dados.origemLat;

            const popupHtml = `
              <div class="tomtom-popup-content">
                <b>Passageiro: ${dados.apelido}</b><br><br>
                <a href="#" onclick="aceitarCorridaEspecifica('${id}'); return false;" style="color:#28a745; font-weight:bold; display:block; margin-bottom:5px;">✅ Aceitar Corrida</a>
                <a href="#" onclick="abrirChatEspecifico('${id}'); return false;" style="color:#007bff; font-weight:bold; display:block;">💬 Abrir Chat com Passageiro</a>
              </div>
            `;

            if (marcadoresPassageiros[id]) {
              marcadoresPassageiros[id].marker.setLngLat([lng, lat]);
              marcadoresPassageiros[id].popup.setHTML(popupHtml);
            } else {
              const popup = new tt.Popup({ offset: 30 }).setHTML(popupHtml);
              const marker = new tt.Marker().setLngLat([lng, lat]).setPopup(popup).addTo(map);
              marcadoresPassageiros[id] = { marker, popup };
            }
          }
        });

        // Atualiza o rodapé com base nas chamadas ativas (se não estiver em corrida)
        if (!emCorridaAtiva) {
          if (totalProcurando > 0) {
            document.getElementById("info-corrida").innerHTML = `${totalProcurando} passageiro(s) procurando corrida...`;
            document.getElementById("btnAceitar").style.display = "inline-block";
            
            if (ultimaCorridaProcurando) {
              corridaAtualId = ultimaCorridaProcurando.id;
              dadosCorridaAtual = ultimaCorridaProcurando.dados;
            }
          } else {
            document.getElementById("info-corrida").innerHTML = "Aguardando chamadas de passageiros...";
            document.getElementById("btnAceitar").style.display = "none";
            
            Object.keys(marcadoresPassageiros).forEach(id => {
              marcadoresPassageiros[id].marker.remove();
              delete marcadoresPassageiros[id];
            });
          }
        }
      });
    }

    window.abrirChatEspecifico = function(idCorrida) {
      corridaAtualId = idCorrida;
      document.getElementById("chat-container").style.display = "block";
      document.getElementById("tituloChat").innerText = `Chat com Passageiro`;
      escutarMensagensChat(corridaAtualId);
    };

    window.abrirChatDireto = function() {
      if (!corridaAtualId || !dadosCorridaAtual) return;
      document.getElementById("chat-container").style.display = "block";
      document.getElementById("tituloChat").innerText = `Chat com ${dadosCorridaAtual.apelido}`;
      escutarMensagensChat(corridaAtualId);
    };

    async function tracaRotaAtePassageiro(origemLat, origemLng, destinoLat, destinoLng) {
      try {
        const url = `https://api.tomtom.com/routing/1/calculateRoute/${origemLat}%2C${origemLng}%3A${destinoLat}%2C${destinoLng}/json?key=${apiKeyTomTom}&traffic=true&language=pt-BR`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const points = data.routes[0].legs[0].points.map(pt => [pt.longitude, pt.latitude]);
          
          const geojson = {
            type: "Feature",
            geometry: {
              type: "LineString",
              coordinates: points
            }
          };

          if (map.getSource(rotaLayerId)) {
            map.getSource(rotaLayerId).setData(geojson);
          } else {
            map.addSource(rotaLayerId, {
              type: 'geojson',
              data: geojson
            });

            map.addLayer({
              id: rotaLayerId,
              type: 'line',
              source: rotaLayerId,
              layout: {
                'line-join': 'round',
                'line-cap': 'round'
              },
              paint: {
                'line-color': '#28a745',
                'line-width': 6
              }
            });
          }

          // Ajusta o zoom do mapa para abranger a rota completa
          const bounds = new tt.LngLatBounds();
          points.forEach(pt => bounds.extend(pt));
          map.fitBounds(bounds, { padding: 50, maxZoom: 15 });
        }
      } catch (e) {
        console.error("Erro ao traçar rota com TomTom Routing:", e);
      }
    }

    window.aceitarCorridaEspecifica = async function(idCorrida) {
      corridaAtualId = idCorrida;
      aceitarCorrida();
    };

    window.aceitarCorrida = async function() {
      if (!corridaAtualId) return;

      emCorridaAtiva = true;

      Object.keys(marcadoresPassageiros).forEach(id => {
        if (id !== corridaAtualId) {
          marcadoresPassageiros[id].marker.remove();
          delete marcadoresPassageiros[id];
        }
      });

      document.getElementById("info-corrida").innerHTML = `Corrida aceita! Gerando rota...`;
      document.getElementById("btnAceitar").style.display = "none";
      document.getElementById("btnFinalizar").style.display = "inline-block";

      const corridaRef = doc(db, "corridas", corridaAtualId);
      
      await updateDoc(corridaRef, { 
        status: "aceita",
        motoristaNome: dadosMotorista.nome,
        motoristaTelefone: dadosMotorista.telefone
      });

      if (!dadosCorridaAtual && marcadoresPassageiros[corridaAtualId]) {
        const lngLat = marcadoresPassageiros[corridaAtualId].marker.getLngLat();
        dadosCorridaAtual = { apelido: "Passageiro", origemLat: lngLat.lat, origemLng: lngLat.lng, destinoLat: lngLat.lat, destinoLng: lngLat.lng };
      }

      if (dadosCorridaAtual) {
        document.getElementById("info-corrida").innerHTML = `Corrida aceita! Passageiro: <b>${dadosCorridaAtual.apelido}</b>`;
        abrirChatDireto();
        const origemRota = localizacaoMotorista ? localizacaoMotorista : [dadosCorridaAtual.origemLat, dadosCorridaAtual.origemLng];
        tracaRotaAtePassageiro(origemRota[0], origemRota[1], dadosCorridaAtual.destinoLat, dadosCorridaAtual.destinoLng);
      }
    };

    window.finalizarCorrida = async function() {
      if (!corridaAtualId) return;

      const confirmacao = confirm("Deseja realmente finalizar esta corrida?");
      if (!confirmacao) return;

      try {
        const corridaRef = doc(db, "corridas", corridaAtualId);
        await updateDoc(corridaRef, { status: "finalizada" });
      } catch (e) {
        console.error("Erro ao atualizar status de finalização:", e);
      }

      emCorridaAtiva = false;
      corridaAtualId = null;
      dadosCorridaAtual = null;

      if (unsubMensagens) unsubMensagens();
      
      Object.keys(marcadoresPassageiros).forEach(id => {
        marcadoresPassageiros[id].marker.remove();
        delete marcadoresPassageiros[id];
      });

      if (map.getLayer(rotaLayerId)) {
        map.removeLayer(rotaLayerId);
      }
      if (map.getSource(rotaLayerId)) {
        map.removeSource(rotaLayerId);
      }

      document.getElementById("chat-container").style.display = "none";
      document.getElementById("mensagens").innerHTML = "";
      document.getElementById("btnFinalizar").style.display = "none";
      document.getElementById("info-corrida").innerHTML = "Aguardando chamadas de passageiros...";
    };

    function escutarMensagensChat(idCorrida) {
      const mensagensRef = collection(db, "corridas", idCorrida, "mensagens");
      const qMsgs = query(mensagensRef, orderBy("timestamp", "asc"));

      if (unsubMensagens) unsubMensagens();

      unsubMensagens = onSnapshot(qMsgs, (snapshot) => {
        const mensagensDiv = document.getElementById("mensagens");
        mensagensDiv.innerHTML = "";
        snapshot.forEach((docMsg) => {
          const m = docMsg.data();
          const classe = m.remetente === "motorista" ? "msg-motorista" : "msg-passageiro";
          const nomeRemetente = m.remetente === "motorista" ? `Você (${dadosMotorista.nome})` : (dadosCorridaAtual ? dadosCorridaAtual.apelido : "Passageiro");
          mensagensDiv.innerHTML += `<div class="${classe}"><b>${nomeRemetente}:</b> ${m.texto}</div>`;
        });
        mensagensDiv.scrollTop = mensagensDiv.scrollHeight;
      });
    }

    window.enviarMensagem = async function() {
      const texto = document.getElementById("inputMensagem").value;
      if (!texto || !corridaAtualId) return;

      document.getElementById("inputMensagem").value = "";

      const mensagensRef = collection(db, "corridas", corridaAtualId, "mensagens");
      await addDoc(mensagensRef, {
        remetente: "motorista",
        texto: texto,
        timestamp: serverTimestamp()
      });
    };
  </script>
</body>
</html>
